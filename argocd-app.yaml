apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticketing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/joisyousef/Ticketing-Microservice-App.git
    targetRevision: master
    path: infra/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
