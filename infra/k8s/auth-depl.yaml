apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: joisyousef/auth
---
apiVersion: v1
kind: Service
metadata:
  name: auth-srv
spec:
  selector:
    app: auth
  ports:
  - name: auth
    protocol: TCP
    port: 3000
    targetPort: 3000

# The default type is ClusterIP, which exposes the service on a cluster-internal IP. 
# Choosing this value makes the service only reachable from within the cluster. 
# To expose the service externally, use NodePort or LoadBalancer.
